<!DOCTYPE html>
<html>
<head>
    <title>Kaufkraft Pilot - Düsseldorf</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MapLibre & PMTiles Bibliotheken -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        .maplibregl-popup-content { font-family: Arial, sans-serif; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'osm-background': {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap'
                    }
                },
                layers: [{
                    id: 'osm-tiles',
                    type: 'raster',
                    source: 'osm-background'
                }]
            },
            center: [6.78, 51.22], // Düsseldorf
            zoom: 11
        });

        map.on('load', () => {
            
            const pmtilesUrl = new URL('duesseldorf_kaufkraft.pmtiles', window.location.href).href;

            map.addSource('duesseldorf-daten', {
                type: 'vector',
                url: 'pmtiles://' + pmtilesUrl
            });

            map.addLayer({
                'id': 'gitter-layer',
                'type': 'fill',
                'source': 'duesseldorf-daten',
                'source-layer': 'Duessldorf_Web_Format — duesseldorf_gitter_fertig__duesseldorf_gitter_100m__de_grid_etrs89laea_100m__de_grid_laea_100m', 
                'paint': {
                    'fill-color': [
                        'interpolate',
                        ['linear'],
                        ['to-number', ['get', 'einwohner']], // HIER IST DER FIX
                        0, '#f7fbff',      
                        50, '#c6dbef',     
                        100, '#6baed6',    
                        250, '#2171b5',    
                        500, '#08306b'     
                    ],
                    'fill-opacity': 0.75, 
                    'fill-outline-color': '#ffffff' 
                }
            });

            map.on('click', 'gitter-layer', (e) => {
                if (!e.features.length) return;
                
                const einwohner = e.features[0].properties.einwohner;
                
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`<strong>Einwohner auf dieser 100x100m Kachel:</strong> <br><span style="font-size:18px; color:#2171b5;">${einwohner}</span>`)
                    .addTo(map);
            });

            map.on('mouseenter', 'gitter-layer', () => { 
                map.getCanvas().style.cursor = 'pointer'; 
            });
            
            map.on('mouseleave', 'gitter-layer', () => { 
                map.getCanvas().style.cursor = ''; 
            });
        });
    </script>
</body>
</html>
