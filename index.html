<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Geo-Intelligence | powered by SoD</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #111; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Premium UI-Menü mit Branding */
        #menu {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(25, 25, 25, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
            z-index: 1;
            width: 220px;
            color: #fff;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }
        
        .brand { margin: 0 0 20px 0; font-size: 17px; color: #fff; text-transform: uppercase; letter-spacing: 1px; line-height: 1.3; }
        .brand span { font-size: 11px; color: #888; font-weight: normal; letter-spacing: 0; text-transform: none; display: block; margin-top: 2px;}
        
        .subtitle { margin: 0 0 10px 0; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ccc;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .menu-btn:hover { background-color: #3a3a3a; color: #fff; }
        
        .btn-active.familien { background-color: #007cff; color: white; border-color: #007cff; }
        .btn-active.yups { background-color: #ff6b35; color: white; border-color: #ff6b35; }
        .btn-active.premium { background-color: #8c00ff; color: white; border-color: #8c00ff; }
        .btn-active.bestAgers { background-color: #00c46a; color: white; border-color: #00c46a; }

        /* Overlays (NEU) */
        .overlay-btn { background-color: transparent; border: 1px dashed #666; color: #aaa; margin-top: 5px; text-align: center; }
        .overlay-btn:hover { border-color: #fff; color: #fff; background-color: rgba(255,255,255,0.1); }
        .overlay-btn.active { border-color: #fff; background-color: #fff; color: #111; border-style: solid; }

        .legend { margin-top: 20px; }
        .legend-title { font-size: 11px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .legend-bar { width: 100%; height: 6px; border-radius: 3px; background: linear-gradient(to right, rgba(0, 124, 255, 0), rgba(0, 124, 255, 0.75)); transition: background 0.3s ease; }
        .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-top: 4px; font-weight: bold; }

        /* Pop-up Dashboard */
        .maplibregl-popup-content { 
            padding: 20px; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.8); width: 260px;
            background-color: rgba(25, 25, 25, 0.95); color: #fff; border: 1px solid #444; backdrop-filter: blur(10px);
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(25, 25, 25, 0.95); }
        .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(25, 25, 25, 0.95); }
        
        .popup-header { margin-top:0; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; font-weight: bold;}
        
        .section-title { font-size: 10px; color: #888; text-transform: uppercase; margin: 15px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 4px; letter-spacing: 0.5px;}
        .section-title.first { margin-top: 0; }

        .active-target-row { margin-bottom: 5px; }
        .active-target-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; font-weight: bold;}
        .bar-bg { width: 100%; height: 6px; background-color: #333; border-radius: 3px; overflow: hidden; margin-bottom: 15px; }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

        .kpi-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; align-items: center;}
        .kpi-label { color: #aaa; }
        .kpi-value-box { background: #2a2a2a; padding: 4px 8px; border-radius: 6px; border: 1px solid #444; font-weight: bold; color: #fff; min-width: 50px; text-align: right; }
        
        .score-wrap { display: flex; align-items: center; }
        .mini-bar-bg { width: 40px; height: 4px; background: #333; border-radius: 2px; margin-left: 10px; overflow: hidden;}
        .mini-bar-fill { height: 100%; background: #ccc; }

    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="menu">
        <h1 class="brand">Geo-Intelligence<span>powered by SoD</span></h1>
        <h2 class="subtitle">Zielgruppen (100m)</h2>
        
        <button id="btn-familien" class="menu-btn btn-active familien">Familien</button>
        <button id="btn-yups" class="menu-btn">YUPs (20-39)</button>
        <button id="btn-premium" class="menu-btn">Premium / DINKs</button>
        <button id="btn-bestAgers" class="menu-btn">Best Agers (60+)</button>

        <h2 class="subtitle" style="margin-top: 20px;">Overlays</h2>
        <button id="btn-toggle-plz" class="menu-btn overlay-btn">PLZ-Gebiete einblenden</button>

        <div class="legend">
            <div class="legend-title">Hotspot-Score</div>
            <div class="legend-bar" id="legend-gradient"></div>
            <div class="legend-labels">
                <span>40</span>
                <span>100</span>
            </div>
        </div>
    </div>

    <script>
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);
        let PMTILES_URL = new URL("duesseldorf_kaufkraft_final.pmtiles", window.location.href).href;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [6.7828, 51.2277], 
            zoom: 11.5,
            minZoom: 10.5, 
            maxZoom: 16,   
            maxBounds: [
                [6.45, 51.05], 
                [7.15, 51.40]  
            ]
        });

        const colorExpressions = {
            familien: ['interpolate', ['linear'], ['*', ['get', 'proxy_familien'], 4], 0, 'rgba(0, 124, 255, 0)', 40, 'rgba(0, 124, 255, 0)', 100, 'rgba(0, 124, 255, 0.75)'],
            yups: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_alter_20_39'], 0.83], ['get', 'proxy_singles']], 0, 'rgba(255, 107, 53, 0)', 40, 'rgba(255, 107, 53, 0)', 100, 'rgba(255, 107, 53, 0.75)'],
            premium: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_paare'], 1.6], ['+', ['*', ['get', 'proxy_miete'], 2], ['*', ['get', 'proxy_eigentuemer'], 0.6]]], 0, 'rgba(140, 0, 255, 0)', 40, 'rgba(140, 0, 255, 0)', 100, 'rgba(140, 0, 255, 0.75)'],
            bestAgers: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_alter_60_plus'], 1.4], ['*', ['get', 'proxy_eigentuemer'], 0.6]], 0, 'rgba(0, 196, 106, 0)', 40, 'rgba(0, 196, 106, 0)', 100, 'rgba(0, 196, 106, 0.75)']
        };

        const legendGradients = {
            familien: 'linear-gradient(to right, rgba(0, 124, 255, 0), rgba(0, 124, 255, 0.75))',
            yups: 'linear-gradient(to right, rgba(255, 107, 53, 0), rgba(255, 107, 53, 0.75))',
            premium: 'linear-gradient(to right, rgba(140, 0, 255, 0), rgba(140, 0, 255, 0.75))',
            bestAgers: 'linear-gradient(to right, rgba(0, 196, 106, 0), rgba(0, 196, 106, 0.75))'
        };
        
        const targetColors = { familien: '#007cff', yups: '#ff6b35', premium: '#8c00ff', bestAgers: '#00c46a' };
        const targetNames = { familien: 'Familien', yups: 'YUPs (20-39)', premium: 'Premium (DINKs)', bestAgers: 'Best Agers (60+)' };

        let activeTarget = 'familien';
        let plzVisible = false;

        function calculateMarketingData(props) {
            const cap = (val) => Math.min(Math.max(Math.round(val || 0), 0), 100);
            
            let scores = {
                familien: cap(((props.proxy_familien || 0) / 25) * 100),
                yups: cap(((props.proxy_alter_20_39 || 0) / 60) * 50 + ((props.proxy_singles || 0) / 50) * 50),
                premium: cap(((props.proxy_paare || 0) / 25) * 40 + ((props.proxy_miete || 0) / 15) * 30 + ((props.proxy_eigentuemer || 0) / 50) * 30),
                bestAgers: cap(((props.proxy_alter_60_plus || 0) / 50) * 70 + ((props.proxy_eigentuemer || 0) / 50) * 30)
            };

            let isPopulated = ((props.proxy_familien || 0) + (props.proxy_singles || 0) + (props.proxy_paare || 0) + (props.proxy_alter_20_39 || 0) + (props.proxy_alter_60_plus || 0)) > 0;

            let hhneRounded = 0;
            let kaufkraftRounded = 0;
            let diyScore = 0;
            let convScore = 0;
            let techScore = 0;
            let eMobilityScore = 0;

            if (isPopulated) {
                let rawRent = (props.proxy_miete || 9) * (props.proxy_wohnflaeche || 60);
                let estimatedHHNE = Math.round((rawRent * 3.3) + ((props.proxy_eigentuemer || 0) * 20));
                if (estimatedHHNE < 1500) estimatedHHNE = 1500 + Math.floor(Math.random() * 500); 
                hhneRounded = Math.round(estimatedHHNE / 50) * 50; 
                kaufkraftRounded = Math.round((hhneRounded * 0.45) / 50) * 50;

                diyScore = cap(((props.proxy_eigentuemer || 0) * 1.1) + ((props.proxy_wohnflaeche || 0) / 150) * 20);
                convScore = cap(((props.proxy_singles || 0) / 50) * 45 + ((props.proxy_alter_20_39 || 0) / 60) * 45 + ((props.proxy_miete || 0) / 20) * 10);
                techScore = cap(((props.proxy_alter_20_39 || 0) / 60) * 50 + ((props.proxy_singles || 0) / 50) * 40 + ((props.proxy_miete || 0) / 20) * 10);
                eMobilityScore = cap(((props.proxy_eigentuemer || 0) / 100) * 50 + ((props.proxy_paare || 0) / 25) * 30 + ((props.proxy_familien || 0) / 25) * 20);
            }

            return { 
                scores, 
                hhne: hhneRounded, 
                kaufkraft: kaufkraftRounded, 
                diy: diyScore, 
                convenience: convScore,
                tech: techScore,
                emobility: eMobilityScore
            };
        }

        map.on('load', () => {
            // 1. Zensus-Daten (Basis-Gitter)
            map.addSource('zensus-daten', { type: 'vector', url: "pmtiles://" + PMTILES_URL });
            map.addLayer({
                'id': 'gitter-layer',
                'type': 'fill',
                'source': 'zensus-daten',
                'source-layer': 'duesseldorf_kaufkraft_final',
                'paint': {
                    'fill-color': colorExpressions.familien,
                    'fill-outline-color': '#111'
                }
            });

            // 2. NEU: PLZ-Daten über Live-API (Opendatasoft) laden
            // HIER WAR DER FEHLER: "data" statt "url" muss bei GeoJSON verwendet werden.
            map.addSource('plz-daten', {
                'type': 'geojson',
                'data': 'https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/georef-germany-postleitzahl/exports/geojson?where=krs_name%3D%22D%C3%BCsseldorf%22'
            });

            // Layer für die PLZ-Grenzen
            map.addLayer({
                'id': 'plz-linien',
                'type': 'line',
                'source': 'plz-daten',
                'layout': { 'visibility': 'none' }, // Initial unsichtbar
                'paint': {
                    'line-color': '#ffffff',
                    'line-width': 1.5,
                    'line-opacity': 0.4,
                    'line-dasharray': [3, 3]
                }
            });

            // Layer für die PLZ-Zahlen (Zentriert)
            map.addLayer({
                'id': 'plz-labels',
                'type': 'symbol',
                'source': 'plz-daten',
                'layout': {
                    'visibility': 'none', // Initial unsichtbar
                    'text-field': ['get', 'plz_code'],
                    'text-size': 14
                },
                'paint': {
                    'text-color': '#ffffff',
                    'text-halo-color': '#111111',
                    'text-halo-width': 2
                }
            });

            // Menü-Logik (Zielgruppen)
            const buttons = [
                { id: 'btn-familien', type: 'familien' },
                { id: 'btn-yups', type: 'yups' },
                { id: 'btn-premium', type: 'premium' },
                { id: 'btn-bestAgers', type: 'bestAgers' }
            ];

            buttons.forEach(btnInfo => {
                document.getElementById(btnInfo.id).addEventListener('click', () => {
                    buttons.forEach(b => document.getElementById(b.id).className = 'menu-btn');
                    document.getElementById(btnInfo.id).classList.add('btn-active', btnInfo.type);
                    
                    activeTarget = btnInfo.type;
                    
                    map.setPaintProperty('gitter-layer', 'fill-color', colorExpressions[btnInfo.type]);
                    document.getElementById('legend-gradient').style.background = legendGradients[btnInfo.type];
                });
            });

            // Menü-Logik (PLZ Toggle)
            document.getElementById('btn-toggle-plz').addEventListener('click', (e) => {
                plzVisible = !plzVisible;
                const visibility = plzVisible ? 'visible' : 'none';
                
                map.setLayoutProperty('plz-linien', 'visibility', visibility);
                map.setLayoutProperty('plz-labels', 'visibility', visibility);
                
                if (plzVisible) {
                    e.target.classList.add('active');
                    e.target.innerText = 'PLZ-Gebiete ausblenden';
                } else {
                    e.target.classList.remove('active');
                    e.target.innerText = 'PLZ-Gebiete einblenden';
                }
            });

            // Pop-up Logik
            map.on('click', 'gitter-layer', (e) => {
                const props = e.features[0].properties;
                const data = calculateMarketingData(props);
                const fmt = (num) => new Intl.NumberFormat('de-DE').format(num);

                let popupHTML = `
                    <div class="popup-header">Insight Dashboard</div>
                    
                    <div class="section-title first">Fokus-Zielgruppe</div>
                    <div class="active-target-row">
                        <div class="active-target-label" style="color: ${targetColors[activeTarget]}">
                            <span>${targetNames[activeTarget]}</span> 
                            <span>${data.scores[activeTarget]} / 100</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${data.scores[activeTarget]}%; background-color: ${targetColors[activeTarget]};"></div>
                        </div>
                    </div>

                    <div class="section-title">Finanz- & Kaufkraft-Index</div>
                    
                    <div class="kpi-row">
                        <span class="kpi-label">HH-Nettoeinkommen</span>
                        <span class="kpi-value-box">Ø ${fmt(data.hhne)} €</span>
                    </div>
                    <div class="kpi-row">
                        <span class="kpi-label">Frei verfügbar (Kaufkraft)</span>
                        <span class="kpi-value-box" style="color:#00c46a;">Ø ${fmt(data.kaufkraft)} €</span>
                    </div>

                    <div class="section-title">Affinitäten (0-100)</div>

                    <div class="kpi-row">
                        <span class="kpi-label">Home-Improvement</span>
                        <div class="score-wrap">
                            <span style="font-weight:bold; width: 25px; text-align:right;">${data.diy}</span>
                            <div class="mini-bar-bg"><div class="mini-bar-fill" style="width: ${data.diy}%;"></div></div>
                        </div>
                    </div>
                    <div class="kpi-row">
                        <span class="kpi-label">Urban Convenience</span>
                        <div class="score-wrap">
                            <span style="font-weight:bold; width: 25px; text-align:right;">${data.convenience}</span>
                            <div class="mini-bar-bg"><div class="mini-bar-fill" style="width: ${data.convenience}%;"></div></div>
                        </div>
                    </div>
                    <div class="kpi-row">
                        <span class="kpi-label">Tech & Early Adopters</span>
                        <div class="score-wrap">
                            <span style="font-weight:bold; width: 25px; text-align:right;">${data.tech}</span>
                            <div class="mini-bar-bg"><div class="mini-bar-fill" style="width: ${data.tech}%;"></div></div>
                        </div>
                    </div>
                    <div class="kpi-row">
                        <span class="kpi-label">E-Mobility & Drive</span>
                        <div class="score-wrap">
                            <span style="font-weight:bold; width: 25px; text-align:right;">${data.emobility}</span>
                            <div class="mini-bar-bg"><div class="mini-bar-fill" style="width: ${data.emobility}%;"></div></div>
                        </div>
                    </div>
                `;

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(popupHTML)
                    .addTo(map);
            });

            map.on('mouseenter', 'gitter-layer', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'gitter-layer', () => map.getCanvas().style.cursor = '');
        });
    </script>
</body>
</html>
