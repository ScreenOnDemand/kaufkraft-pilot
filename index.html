<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Düsseldorf Kaufkraft - Geo-Intelligence</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #111; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #menu {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1;
            width: 200px;
            color: #fff;
            border: 1px solid #333;
        }
        #menu h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ccc;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .menu-btn:hover { background-color: #3a3a3a; color: #fff; }
        
        .btn-active.familien { background-color: #007cff; color: white; border-color: #007cff; }
        .btn-active.yups { background-color: #ff6b35; color: white; border-color: #ff6b35; }
        .btn-active.premium { background-color: #8c00ff; color: white; border-color: #8c00ff; }
        .btn-active.bestAgers { background-color: #00c46a; color: white; border-color: #00c46a; }

        .maplibregl-popup-content { 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 240px;
            background-color: rgba(30, 30, 30, 0.95);
            color: #fff;
            border: 1px solid #444;
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(30, 30, 30, 0.95); }
        .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(30, 30, 30, 0.95); }
        
        .popup-header { margin-top:0; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .score-row { margin-bottom: 12px; font-size: 13px; }
        .score-label { display: flex; justify-content: space-between; margin-bottom: 5px; color: #ccc; }
        .score-value { font-weight: bold; color: #fff; }
        .bar-bg { width: 100%; height: 6px; background-color: #444; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        
        .fill-familien { background-color: #007cff; }
        .fill-yups { background-color: #ff6b35; }
        .fill-premium { background-color: #8c00ff; }
        .fill-bestAgers { background-color: #00c46a; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="menu">
        <h2>Zielgruppen</h2>
        <button id="btn-familien" class="menu-btn btn-active familien">Familien</button>
        <button id="btn-yups" class="menu-btn">YUPs (20-39)</button>
        <button id="btn-premium" class="menu-btn">Premium / DINKs</button>
        <button id="btn-bestAgers" class="menu-btn">Best Agers (60+)</button>
    </div>

    <script>
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);
        let PMTILES_URL = new URL("duesseldorf_kaufkraft_final.pmtiles", window.location.href).href;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [6.7828, 51.2277], 
            zoom: 11
            // pitch und bearing wurden entfernt, Karte ist wieder flach
        });

        // Frosted Glass Farben: Maximale Deckkraft auf 0.45 reduziert für sanftes Leuchten
        const colorExpressions = {
            familien: ['interpolate', ['linear'], ['*', ['get', 'proxy_familien'], 4], 0, 'rgba(0, 124, 255, 0)', 100, 'rgba(0, 124, 255, 0.45)'],
            yups: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_alter_20_39'], 0.83], ['get', 'proxy_singles']], 0, 'rgba(255, 107, 53, 0)', 100, 'rgba(255, 107, 53, 0.45)'],
            premium: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_paare'], 1.6], ['+', ['*', ['get', 'proxy_miete'], 2], ['*', ['get', 'proxy_eigentuemer'], 0.6]]], 0, 'rgba(140, 0, 255, 0)', 100, 'rgba(140, 0, 255, 0.45)'],
            bestAgers: ['interpolate', ['linear'], ['+', ['*', ['get', 'proxy_alter_60_plus'], 1.4], ['*', ['get', 'proxy_eigentuemer'], 0.6]], 0, 'rgba(0, 196, 106, 0)', 100, 'rgba(0, 196, 106, 0.45)']
        };

        function calculateScores(props) {
            const cap = (val) => Math.min(Math.max(Math.round(val), 0), 100);
            let scoreFamilien = (props.proxy_familien / 25) * 100; 
            let scoreYUPs = (props.proxy_alter_20_39 / 60) * 50 + (props.proxy_singles / 50) * 50;
            let scorePremium = (props.proxy_paare / 25) * 40 + (props.proxy_miete / 15) * 30 + (props.proxy_eigentuemer / 50) * 30;
            let scoreBestAgers = (props.proxy_alter_60_plus / 50) * 70 + (props.proxy_eigentuemer / 50) * 30;

            return {
                familien: cap(scoreFamilien) || 0,
                yups: cap(scoreYUPs) || 0,
                premium: cap(scorePremium) || 0,
                bestAgers: cap(scoreBestAgers) || 0
            };
        }

        map.on('load', () => {
            map.addSource('zensus-daten', { type: 'vector', url: "pmtiles://" + PMTILES_URL });

            // Layer wieder auf 'fill' zurückgesetzt und Outline unsichtbar gemacht
            map.addLayer({
                'id': 'gitter-layer',
                'type': 'fill',
                'source': 'zensus-daten',
                'source-layer': 'duesseldorf_kaufkraft_final',
                'paint': {
                    'fill-color': colorExpressions.familien,
                    'fill-outline-color': 'rgba(0,0,0,0)' // Kanten komplett unsichtbar
                }
            });

            const buttons = [
                { id: 'btn-familien', type: 'familien' },
                { id: 'btn-yups', type: 'yups' },
                { id: 'btn-premium', type: 'premium' },
                { id: 'btn-bestAgers', type: 'bestAgers' }
            ];

            buttons.forEach(btnInfo => {
                document.getElementById(btnInfo.id).addEventListener('click', () => {
                    buttons.forEach(b => document.getElementById(b.id).className = 'menu-btn');
                    document.getElementById(btnInfo.id).classList.add('btn-active', btnInfo.type);
                    
                    // Schaltet sanft die Flächenfarbe um
                    map.setPaintProperty('gitter-layer', 'fill-color', colorExpressions[btnInfo.type]);
                });
            });

            map.on('click', 'gitter-layer', (e) => {
                const props = e.features[0].properties;
                const scores = calculateScores(props);

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <h3 class="popup-header">Gitter-Analyse</h3>
                        <div class="score-row"><div class="score-label"><span>Familien</span> <span class="score-value">${scores.familien}</span></div><div class="bar-bg"><div class="bar-fill fill-familien" style="width: ${scores.familien}%;"></div></div></div>
                        <div class="score-row"><div class="score-label"><span>YUPs (20-39)</span> <span class="score-value">${scores.yups}</span></div><div class="bar-bg"><div class="bar-fill fill-yups" style="width: ${scores.yups}%;"></div></div></div>
                        <div class="score-row"><div class="score-label"><span>Premium (DINKs)</span> <span class="score-value">${scores.premium}</span></div><div class="bar-bg"><div class="bar-fill fill-premium" style="width: ${scores.premium}%;"></div></div></div>
                        <div class="score-row"><div class="score-label"><span>Best Agers (60+)</span> <span class="score-value">${scores.bestAgers}</span></div><div class="bar-bg"><div class="bar-fill fill-bestAgers" style="width: ${scores.bestAgers}%;"></div></div></div>
                    `)
                    .addTo(map);
            });

            map.on('mouseenter', 'gitter-layer', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'gitter-layer', () => map.getCanvas().style.cursor = '');
        });
    </script>
</body>
</html>
